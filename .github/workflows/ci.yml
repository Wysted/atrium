name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Same toolchain policy as compose.yaml: never download another Go.
      GOTOOLCHAIN: local
      # Throwaway database that lives only on this runner; not a secret.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: platform
      PGPASSWORD: ci-throwaway-password
      PGDATABASE: platform
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: platform
          POSTGRES_DB: platform
          POSTGRES_PASSWORD: ci-throwaway-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2" # keep in sync with the go service in compose.yaml
          cache-dependency-path: platform/**/go.sum
      # go:embed all:dist only needs the tracked .gitkeep, so the Nuxt build is not required here.
      - name: Test
        run: |
          for mod in platform/api platform/sdk/go platform/examples/hello; do
            (cd "$mod" && go test ./...)
          done
