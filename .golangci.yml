# golangci-lint v2 config for every Go module in the repo (run with local/lint.sh).
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      # Test helpers derive their own bounded context from t on purpose (r.ctx(t)); threading ctx through every
      # helper adds noise without changing behavior.
      - path: _test\.go
        linters:
          - contextcheck

formatters:
  enable:
    - gofmt
