apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: platform}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Internal listener (/forwardauth, /healthz, /readyz): Traefik only. /forwardauth trusts X-Forwarded-*, so app
# namespaces must never reach it; kubelet probes come from the node and are not filtered. Nothing else may reach 8081.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-internal, namespace: platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: platform-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports:
        - {protocol: TCP, port: 8081}
---
# JWKS listener (GET /.well-known/jwks.json only): app namespaces (atrium.wysted.dev/app-namespace=true, which includes
# the portal). The policy filters by PORT, so this port serves nothing else on purpose. Anything that can label a
# namespace joins this set, and all it gets is public keys.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-jwks, namespace: platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: platform-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {atrium.wysted.dev/app-namespace: "true"}}
      ports:
        - {protocol: TCP, port: 8083}
---
# Public listener: Traefik only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-public, namespace: platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: platform-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports:
        - {protocol: TCP, port: 8080}
---
# Egress for every pod of the namespace (platform-api and the migrate Job): DNS and PostgreSQL only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-egress-dns-db, namespace: platform}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-db}}
          podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
      ports:
        - {protocol: TCP, port: 5432}
---
# Metrics listener: the Prometheus pods of the monitoring namespace only. There is no authentication on /metrics, so
# this rule is the whole access control (docs/reference/metrics.md, "Metrics"). Anything able to run a pod labelled
# app.kubernetes.io/name=prometheus in `monitoring` joins this set: keep that namespace to the monitoring stack.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-metrics, namespace: platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: platform-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports:
        - {protocol: TCP, port: 9090}
