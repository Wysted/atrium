# Alert rules of the portal platform (platform-api and portal), plain Prometheus format.
#
# This file is the SOURCE: operator/prometheusrule.yaml (the PrometheusRule for adopters with the Prometheus Operator)
# is generated from it by ../gen-prometheusrule.sh, and ../test-rules.sh fails if they differ. Unit tests:
# tests/portal-platform.test.yaml (promtool, run by ../test-rules.sh).
#
# Assumptions for adopters that scrape with their own configuration:
#   - platform-api is scraped with job="platform-api" and the portal with job="portal" (the PodMonitors in
#     ../operator set it; with a static or annotation-based config, relabel to these names);
#   - the metric catalog is the one in platform/docs/contract.md, block 6 "Metrics";
#   - per-replica rules (SigningKey*, DBPoolSaturated) use the `pod` label, which the PodMonitors add; a scrape config
#     that does not attach the pod name must relabel it (or the alert text loses the replica, not the alert itself);
#   - thresholds are starting points, tune them to the load of the installation;
#   - ProbeNotWriting assumes the probe is enabled: with PORTAL_PROBE_INTERVAL=0 the round counters stay at 0 and the
#     rule fires forever, so drop it from installations that disable the probe (tracked in TODO.md).
#
# Every rule has a severity: critical = a protection or the login path is broken, act now; warning = degraded or
# blind spot, act in working hours. The `for:` values absorb a restart or a rollout and the probe cadence (every 5
# minutes by default; probe counters are looked at over 15 minutes).
groups:
  - name: portal-platform.integration
    rules:
      # portal_deployments_by_probe_status is computed from the database, so every replica reports the same state:
      # max() makes one alert, not one per replica. A host that answers a cookie-less navigation with anything but a
      # redirect to the auth host login is reachable WITHOUT ForwardAuth. The probe runs every 5 minutes: 5 minutes of
      # `for:` is one full round, enough to rule out a transient answer, short because it is the worst failure.
      - alert: UnprotectedDeployment
        expr: max(portal_deployments_by_probe_status{status="unprotected"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A deployment is reachable without ForwardAuth"
          description: >-
            {{ $value }} deployment(s) answered the integration probe without the login redirect. Open the app health
            view in the portal: `unprotected` on a host that was seen means a route without the ForwardAuth middleware;
            never seen plus unprotected means a missing or wrong route.

      # An inconclusive round means the control sample failed (the probe could not tell a protected host from a broken
      # platform-api), so no status was written. One is noise; rounds that keep coming back inconclusive blind the
      # probe, and UnprotectedDeployment with it.
      - alert: ProbeInconclusive
        expr: sum(increase(portal_probe_rounds_total{result="inconclusive"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The integration probe has been inconclusive for 30 minutes"
          description: >-
            Probe rounds keep failing their control sample, so deployment statuses are not being refreshed. Check that
            the portal can reach the public entrypoint (PORTAL_PROBE_ADDR) and that platform-api answers a navigation
            with the login redirect.

      # The probe is also blind when rounds fail with result="error", or when no round runs at all (every replica stuck,
      # advisory lock never released): no `written` round for 30 minutes while a portal replica is up. Both cases leave
      # deployment statuses frozen, so UnprotectedDeployment keeps reporting an old state. `idle` rounds (nothing due)
      # do not count as written, but with the default 5 minute interval something is always due within 30 minutes
      # (the portal's own deployment at least). If you raise PORTAL_PROBE_INTERVAL, widen the window.
      - alert: ProbeNotWriting
        expr: sum(increase(portal_probe_rounds_total{result="written"}[30m])) == 0 and sum(up{job="portal"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The integration probe has not written a result for 40 minutes"
          description: >-
            No probe round wrote deployment statuses although the portal is up: rounds are failing (result="error"),
            skipped by every replica or not running. Statuses are frozen, so UnprotectedDeployment reflects an old
            state. Check the portal logs and portal_probe_rounds_total by result.

      # The gauge is absent for the scrape in which the count fails (a stale value would hide the problem), so a
      # failing count also silences UnprotectedDeployment: this alert is what tells you.
      - alert: ProbeStatusCountErrors
        expr: sum(increase(portal_probe_status_count_errors_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The portal cannot count deployments by probe status"
          description: >-
            portal_deployments_by_probe_status is missing while the database count fails, so UnprotectedDeployment
            cannot fire. Check the portal database connection and the portal logs.

  - name: portal-platform.forwardauth
    rules:
      # absent() covers a target that was never discovered or whose PodMonitor is gone; sum(up) == 0 covers every
      # replica down. With all replicas down nothing validates a session and every protected app answers 5xx.
      - alert: ForwardAuthDown
        expr: absent(up{job="platform-api"}) or sum(up{job="platform-api"}) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "platform-api is not being scraped or is down"
          description: >-
            No platform-api target is up. ForwardAuth decisions, logins and JWKS depend on it: every protected app
            fails. If the pods are running, check the scrape configuration and the NetworkPolicy to the metrics port.

      - alert: PortalDown
        expr: absent(up{job="portal"}) or sum(up{job="portal"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The portal is not being scraped or is down"
          description: >-
            No portal target is up. Administration, the user's home and the integration probe are unavailable (apps
            keep working: ForwardAuth does not depend on the portal).

      # Ratio of decision="error" (a backend failure or a panic, counted in a defer) over all decisions. The floor on
      # the request rate avoids paging on 1 error out of 3 requests in a quiet night.
      - alert: ForwardAuthErrorsHigh
        expr: |
          sum(rate(platform_forwardauth_decisions_total{decision="error"}[5m]))
            / sum(rate(platform_forwardauth_decisions_total[5m])) > 0.05
          and sum(rate(platform_forwardauth_decisions_total[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of ForwardAuth decisions are errors"
          description: >-
            {{ $value | humanizePercentage }} of ForwardAuth decisions over the last 5 minutes ended in an error
            (a backend failure such as the database, or a panic). Check the platform-api logs and the database.

      # platform_signing_key_loaded is per replica: 0 means this replica cannot sign, so it cannot let anyone in.
      - alert: SigningKeyNotLoaded
        expr: platform_signing_key_loaded == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.pod }} has no signing key loaded"
          description: >-
            This platform-api replica cannot sign assertions. The usual causes are a KEK that does not open the stored
            keys (see SigningKeyKEKMismatch) or no active key in the database.

      # The KEK does not match the active or next keys: the replica neither signs nor rotates. Almost always a wrong
      # or regenerated KEK; never regenerate it in place, keys sealed with the old one become unusable.
      - alert: SigningKeyKEKMismatch
        expr: platform_signing_key_kek_mismatch == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.pod }} has a KEK that does not match the signing keys"
          description: >-
            The KEK mounted on this replica does not open the active or next signing key. Restore the KEK the keys
            were sealed with.

  - name: portal-platform.saturation
    rules:
      # acquired / max of the pgx pool of each process. 90% for 10 minutes means requests are about to queue for a
      # connection (platform_db_pool_acquires_waited_total grows) and latency follows.
      - alert: DBPoolSaturated
        expr: |
          (platform_db_pool_acquired_connections / platform_db_pool_max_connections > 0.9)
          or
          (portal_db_pool_acquired_connections / portal_db_pool_max_connections > 0.9)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} {{ $labels.pod }} uses more than 90% of its database pool"
          description: >-
            {{ $value | humanizePercentage }} of the connections of the pool are in use. Look for slow queries or raise
            the pool size (and PostgreSQL max_connections with it).
