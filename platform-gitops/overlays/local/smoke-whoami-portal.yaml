# Temporary smoke-test fixture (applied and removed by smoke.sh section 22): echoes the request headers the PORTAL route would
# deliver to the portal process. Same host rule as the real portal route plus a PathPrefix (so it wins on its own path only) and
# the SAME middleware list (strip-authorization). Never part of the platform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-whoami-portal
  namespace: portal
  labels: {app.kubernetes.io/name: smoke-whoami-portal, portal.wysted.dev/smoke: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: smoke-whoami-portal}
  template:
    metadata:
      labels: {app.kubernetes.io/name: smoke-whoami-portal, portal.wysted.dev/smoke: "true"}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port", "8080"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-whoami-portal
  namespace: portal
  labels: {portal.wysted.dev/smoke: "true"}
spec:
  selector: {app.kubernetes.io/name: smoke-whoami-portal}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smoke-allow-ingress-traefik
  namespace: portal
  labels: {portal.wysted.dev/smoke: "true"}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: smoke-whoami-portal}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: smoke-whoami-portal
  namespace: portal
  labels: {portal.wysted.dev/smoke: "true"}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`portal.apps.wysted.dev`) && PathPrefix(`/__smoke_whoami`)
      middlewares:
        - {name: strip-authorization}
      services: [{name: smoke-whoami-portal, port: 8080}]
  tls: {}
