# Google OIDC needs outbound HTTPS (accounts.google.com, oauth2.googleapis.com, www.googleapis.com). A standard
# NetworkPolicy cannot match FQDNs, so this allows TCP 443 to the public internet and excludes everything internal:
# the k3d pod CIDR (10.42.0.0/16) and service CIDR (10.43.0.0/16) are inside 10.0.0.0/8; the node and the Docker
# network (172.28.0.0/16) are inside 172.16.0.0/12. Only platform-api pods get it (not the migrate Job).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-google
  namespace: platform
  labels: {app.kubernetes.io/part-of: portal-platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: platform-api}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8       # RFC1918, includes k3d pods 10.42.0.0/16 and services 10.43.0.0/16
              - 172.16.0.0/12    # RFC1918, includes the Docker network / k3d node 172.28.0.0/16
              - 192.168.0.0/16   # RFC1918, includes the Docker Desktop / WSL host range
              - 100.64.0.0/10    # CGNAT
              - 169.254.0.0/16   # link-local (cloud metadata)
              - 127.0.0.0/8
      ports:
        - {protocol: TCP, port: 443}
