# One namespace per concern. Pod Security "restricted" is enforced everywhere.
# Namespaces that host initiative apps carry atrium.wysted.dev/app-namespace=true: platform-api's internal
# listener (JWKS) accepts ingress from them. The portal is an app like any other (reserved initiative `platform`)
# and lives in its own namespace with the same label.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-db
  labels: {app.kubernetes.io/part-of: portal-platform, pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels: {app.kubernetes.io/part-of: portal-platform, pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: hello-a
  labels:
    app.kubernetes.io/part-of: portal-platform
    pod-security.kubernetes.io/enforce: restricted
    atrium.wysted.dev/app-namespace: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: hello-b
  labels:
    app.kubernetes.io/part-of: portal-platform
    pod-security.kubernetes.io/enforce: restricted
    atrium.wysted.dev/app-namespace: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: portal
  labels:
    app.kubernetes.io/part-of: portal-platform
    pod-security.kubernetes.io/enforce: restricted
    atrium.wysted.dev/app-namespace: "true"
