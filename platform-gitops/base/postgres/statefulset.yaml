# Single-instance PostgreSQL for the local cluster. Same image digest as /compose.yaml.
# Secret postgres-bootstrap (created by overlays/local/up.sh): admin-password, owner-password, api-password, portal-password.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal-platform}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal-platform}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal-platform}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal-platform}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_USER, value: postgres_admin}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/db/admin-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          # -h 127.0.0.1 on purpose: during first initialization the entrypoint runs a temporary server that listens
          # on the unix socket only, so a socket probe would report Ready before TCP accepts connections.
          readinessProbe:
            exec: {command: [pg_isready, -q, -h, 127.0.0.1, -U, platform_owner, -d, platform]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [pg_isready, -q, -h, 127.0.0.1, -U, platform_owner, -d, platform]}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: bootstrap, mountPath: /run/secrets/db, readOnly: true}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: initdb
          configMap: {name: postgres-initdb, defaultMode: 0555}
        - name: bootstrap
          secret: {secretName: postgres-bootstrap, defaultMode: 0440}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal-platform}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 2Gi}
