# Extra values layered on local/traefik-values.yaml (chart 41.7.1 -> Traefik v3.7.14).
# The Middlewares platform/strip-assertion and platform/forwardauth MUST exist before applying this, or
# Traefik breaks every route (overlays/local/up.sh applies them first).
#
# Apply (up.sh does it):
#   ./tk helm upgrade traefik traefik/traefik --version 41.7.1 -n traefik \
#     -f local/traefik-values.yaml -f platform-gitops/overlays/local/traefik/entrypoint-values.yaml
# Rollback (drops the entrypoint middleware chain and the access log redaction):
#   ./tk helm upgrade traefik traefik/traefik --version 41.7.1 -n traefik -f local/traefik-values.yaml
ports:
  websecure:
    http:
      middlewares:
        # Order matters: strip the forged assertion first, then ForwardAuth.
        - platform-strip-assertion@kubernetescrd
        - platform-forwardauth@kubernetescrd

# The login code (/_platform/callback?code=) and rd travel in the query string: drop all query parameters
# from the RequestPath access log field (Traefik >= v3.7.3). Headers (Cookie, Set-Cookie, Location) are
# dropped by default (fields.headers.defaultMode: drop).
accessLog:
  fields:
    queryParameters:
      defaultMode: drop
