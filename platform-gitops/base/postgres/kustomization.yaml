apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-db
resources:
  - statefulset.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: postgres-initdb
    files: [initdb.sh]
    options:
      disableNameSuffixHash: true
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: portal-platform}
