apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: platform-db}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Only the platform namespace (platform-api and the migrate Job) and the portal namespace (portal process, its own
# login role). PostgreSQL needs no egress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-platform, namespace: platform-db}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [platform, portal]}
      ports:
        - {protocol: TCP, port: 5432}
