apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: platform}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Internal listener: Traefik (ForwardAuth) and app namespaces (JWKS). /forwardauth trusts X-Forwarded-*,
# so nothing else may reach this port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-internal, namespace: platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: platform-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - namespaceSelector: {matchLabels: {portal.wysted.dev/app-namespace: "true"}}
      ports:
        - {protocol: TCP, port: 8081}
---
# Public listener: Traefik only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-public, namespace: platform}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: platform-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports:
        - {protocol: TCP, port: 8080}
---
# Egress for every pod of the namespace (platform-api and the migrate Job): DNS and PostgreSQL only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-egress-dns-db, namespace: platform}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-db}}
          podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
      ports:
        - {protocol: TCP, port: 5432}
