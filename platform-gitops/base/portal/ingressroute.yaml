# Exact Host() match, patched by the overlay: ForwardAuth answers 200 for the auth host and for preflights, so a router
# without a pinned Host could expose the portal under another name. The entrypoint middlewares (strip-assertion,
# forwardauth) apply to this route as to every websecure route. passHostHeader stays true (contract block 6): the portal
# never derives its identity from X-Forwarded-Host.
# strip-authorization runs after the entrypoint ForwardAuth: the API token never reaches the portal. EVERY route that matches
# a portal host must list it (smoke section 22 fails otherwise).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal
  labels: {app.kubernetes.io/name: portal, app.kubernetes.io/part-of: portal-platform}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`portal.invalid`)
      middlewares:
        - {name: strip-authorization}
      services:
        - {name: portal, port: 8080, passHostHeader: true}
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-authorization
  labels: {app.kubernetes.io/name: portal, app.kubernetes.io/part-of: portal-platform}
spec:
  headers:
    customRequestHeaders:
      # Empty value deletes the header. Local to this namespace: allowCrossNamespace is false, so a middleware in
      # `platform` could not be referenced by the portal route.
      Authorization: ""
