apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: spike-app2
  labels: {app.kubernetes.io/name: app, app.kubernetes.io/instance: app2, app.kubernetes.io/part-of: portal-spike}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: spike-app2
  labels: {app.kubernetes.io/name: app, app.kubernetes.io/instance: app2, app.kubernetes.io/part-of: portal-spike}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: app}
  template:
    metadata:
      labels: {app.kubernetes.io/name: app, app.kubernetes.io/instance: app2, app.kubernetes.io/part-of: portal-spike}
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: portal-spike-app:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_ID, value: app2}
            - {name: LISTEN_ADDR, value: ":8080"}
            # Internal cluster DNS, not through Traefik.
            - {name: AUTHZ_JWKS_URL, value: "http://authz.spike-authz.svc.cluster.local:8080/.well-known/jwks.json"}
          ports:
            - {name: http, containerPort: 8080}
          # Every HTTP path requires a token, so only a TCP probe is meaningful.
          # The app blocks on the JWKS fetch before listening, so readiness doubles as a JWKS check.
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: spike-app2
  labels: {app.kubernetes.io/name: app, app.kubernetes.io/instance: app2, app.kubernetes.io/part-of: portal-spike}
spec:
  selector: {app.kubernetes.io/name: app}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
  namespace: spike-app2
  labels: {app.kubernetes.io/name: app, app.kubernetes.io/instance: app2, app.kubernetes.io/part-of: portal-spike}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`app2.apps.wysted.dev`)
      services:
        - {name: app, port: 8080}
  tls: {}
