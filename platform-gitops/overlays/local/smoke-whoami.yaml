# Temporary smoke-test fixture (applied and removed by smoke.sh): echoes the request headers an app would receive.
# Longer rules (Host + PathPrefix) win over the real IngressRoutes of the same host. Never part of the platform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-whoami
  namespace: hello-a
  labels: {app.kubernetes.io/name: smoke-whoami, atrium.wysted.dev/smoke: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: smoke-whoami}
  template:
    metadata:
      labels: {app.kubernetes.io/name: smoke-whoami, atrium.wysted.dev/smoke: "true"}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port", "8080"]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-whoami
  namespace: hello-a
  labels: {atrium.wysted.dev/smoke: "true"}
spec:
  selector: {app.kubernetes.io/name: smoke-whoami}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smoke-allow-ingress-traefik
  namespace: hello-a
  labels: {atrium.wysted.dev/smoke: "true"}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: smoke-whoami}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: smoke-whoami-app
  namespace: hello-a
  labels: {atrium.wysted.dev/smoke: "true"}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`hello-a.apps.wysted.dev`) && PathPrefix(`/__smoke_whoami`)
      services: [{name: smoke-whoami, port: 8080}]
  tls: {}
---
# Same fixture reached through the auth host: ForwardAuth answers 200 without an assertion there.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: smoke-whoami-auth
  namespace: hello-a
  labels: {atrium.wysted.dev/smoke: "true"}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`auth.apps.wysted.dev`) && PathPrefix(`/__smoke_whoami`)
      services: [{name: smoke-whoami, port: 8080}]
  tls: {}
