apiVersion: v1
kind: ServiceAccount
metadata:
  name: authz
  namespace: spike-authz
  labels: {app.kubernetes.io/name: authz, app.kubernetes.io/part-of: portal-spike}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz
  namespace: spike-authz
  labels: {app.kubernetes.io/name: authz, app.kubernetes.io/part-of: portal-spike}
spec:
  # Single replica: sessions, codes and the signing key live in memory.
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: authz}
  template:
    metadata:
      labels: {app.kubernetes.io/name: authz, app.kubernetes.io/part-of: portal-spike}
    spec:
      serviceAccountName: authz
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: authz
          image: portal-spike-authz:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: LISTEN_ADDR, value: ":8080"}
            - {name: AUTH_HOST, value: auth.apps.wysted.dev}
          ports:
            - {name: http, containerPort: 8080}
          # authz has no health endpoint; the JWKS route answers 200 without state.
          readinessProbe:
            httpGet: {path: /.well-known/jwks.json, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /.well-known/jwks.json, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: authz
  namespace: spike-authz
  labels: {app.kubernetes.io/name: authz, app.kubernetes.io/part-of: portal-spike}
spec:
  selector: {app.kubernetes.io/name: authz}
  ports:
    - {name: http, port: 8080, targetPort: http}
