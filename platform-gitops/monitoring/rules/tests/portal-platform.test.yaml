# Unit tests of ../portal-platform.rules.yaml, run with promtool by ../../test-rules.sh. Every rule has a case that
# fires and cases that must not: below the threshold, shorter than `for:`, and (where it matters) the failure that the
# rule must stay silent about.
rule_files:
  - ../portal-platform.rules.yaml

evaluation_interval: 1m

tests:
  # ---- UnprotectedDeployment -------------------------------------------------------------------------------------
  - name: UnprotectedDeployment fires once for two replicas that report the same state
    interval: 1m
    input_series:
      - series: 'portal_deployments_by_probe_status{status="unprotected", pod="portal-a", job="portal"}'
        values: '0x2 1x20'
      - series: 'portal_deployments_by_probe_status{status="unprotected", pod="portal-b", job="portal"}'
        values: '0x2 1x20'
      - series: 'portal_deployments_by_probe_status{status="ok", pod="portal-a", job="portal"}'
        values: '3x22'
    alert_rule_test:
      - eval_time: 5m # unprotected since minute 2: still inside `for: 5m`
        alertname: UnprotectedDeployment
        exp_alerts: []
      - eval_time: 12m
        alertname: UnprotectedDeployment
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "A deployment is reachable without ForwardAuth"
              description: "1 deployment(s) answered the integration probe without the login redirect. Open the app health view in the portal: `unprotected` on a host that was seen means a route without the ForwardAuth middleware; never seen plus unprotected means a missing or wrong route."

  - name: UnprotectedDeployment stays quiet when every deployment is protected
    interval: 1m
    input_series:
      - series: 'portal_deployments_by_probe_status{status="unprotected", pod="portal-a", job="portal"}'
        values: '0x30'
      - series: 'portal_deployments_by_probe_status{status="ok", pod="portal-a", job="portal"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: UnprotectedDeployment
        exp_alerts: []

  - name: UnprotectedDeployment ignores a transient unprotected status shorter than for
    interval: 1m
    input_series:
      - series: 'portal_deployments_by_probe_status{status="unprotected", pod="portal-a", job="portal"}'
        values: '0x2 1x3 0x25'
    alert_rule_test:
      - eval_time: 30m
        alertname: UnprotectedDeployment
        exp_alerts: []

  - name: UnprotectedDeployment is silent when the gauge is absent (ProbeStatusCountErrors covers that)
    interval: 1m
    input_series:
      - series: 'portal_deployments_by_probe_status{status="ok", pod="portal-a", job="portal"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: UnprotectedDeployment
        exp_alerts: []

  # ---- ProbeInconclusive (input every 5 minutes: the default probe cadence) ---------------------------------------
  - name: ProbeInconclusive fires when rounds keep coming back inconclusive
    interval: 5m
    input_series:
      - series: 'portal_probe_rounds_total{result="inconclusive", pod="portal-a", job="portal"}'
        values: '0+1x20'
      - series: 'portal_probe_rounds_total{result="written", pod="portal-a", job="portal"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 60m
        alertname: ProbeInconclusive
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The integration probe has been inconclusive for 30 minutes"
              description: "Probe rounds keep failing their control sample, so deployment statuses are not being refreshed. Check that the portal can reach the public entrypoint (PORTAL_PROBE_ADDR) and that platform-api answers a navigation with the login redirect."

  - name: ProbeInconclusive ignores one inconclusive round
    interval: 5m
    input_series:
      - series: 'portal_probe_rounds_total{result="inconclusive", pod="portal-a", job="portal"}'
        values: '0x3 1x30'
      - series: 'portal_probe_rounds_total{result="written", pod="portal-a", job="portal"}'
        values: '0+1x33'
    alert_rule_test:
      - eval_time: 90m
        alertname: ProbeInconclusive
        exp_alerts: []

  - name: ProbeInconclusive stays quiet when every round is written
    interval: 5m
    input_series:
      - series: 'portal_probe_rounds_total{result="inconclusive", pod="portal-a", job="portal"}'
        values: '0x30'
      - series: 'portal_probe_rounds_total{result="written", pod="portal-a", job="portal"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 120m
        alertname: ProbeInconclusive
        exp_alerts: []

  # ---- ProbeNotWriting (input every 5 minutes; the rule is time() - last write timestamp > 3 x interval, for 10m) ---
  # Series values are Unix seconds and the test clock starts at 0, so '0+300x30' is a replica that writes every round
  # (timestamp = now). Stall: age > 900 s with a 300 s interval, then 10 minutes of `for:`.
  - name: ProbeNotWriting stays quiet while rounds are written
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0+300x30'
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '300x30'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 150m
        alertname: ProbeNotWriting
        exp_alerts: []

  - name: ProbeNotWriting stays quiet when one replica writes and the others skip
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0+300x30'
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-b", job="portal"}'
        values: '0x30' # skips every round: stays at its start time
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '300x30'
      - series: 'portal_probe_interval_seconds{pod="portal-b", job="portal"}'
        values: '300x30'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x30'
      - series: 'up{job="portal", pod="portal-b"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 150m
        alertname: ProbeNotWriting
        exp_alerts: []

  - name: ProbeNotWriting fires after 3 intervals without a write plus for
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0+300x5 1500x60' # last write at 25 minutes
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '300x65'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x65'
    alert_rule_test:
      - eval_time: 40m # age 15 minutes = 3 intervals, not above yet
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 45m # condition true since minute 41: inside `for: 10m`
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 60m
        alertname: ProbeNotWriting
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The integration probe is enabled but has not written a result for more than three intervals"
              description: "No probe round wrote deployment statuses over at least three probe intervals although the portal is up: rounds are failing (result=\"error\"), skipped by every replica or not running. Statuses are frozen, so UnprotectedDeployment reflects an old state. Check the portal logs and portal_probe_rounds_total by result."

  - name: ProbeNotWriting never fires when the probe is disabled (interval 0)
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0x60' # stays at the start time forever
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '0x60'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 290m
        alertname: ProbeNotWriting
        exp_alerts: []

  - name: ProbeNotWriting respects the configured interval (30 minutes)
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0+300x5 1500x70'
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '1800x75'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x75'
    alert_rule_test:
      - eval_time: 100m # age 75 minutes < 3 x 30 minutes
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 130m # age above 90 minutes since minute 116, plus for
        alertname: ProbeNotWriting
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The integration probe is enabled but has not written a result for more than three intervals"
              description: "No probe round wrote deployment statuses over at least three probe intervals although the portal is up: rounds are failing (result=\"error\"), skipped by every replica or not running. Statuses are frozen, so UnprotectedDeployment reflects an old state. Check the portal logs and portal_probe_rounds_total by result."

  - name: ProbeNotWriting follows an interval change (300 s raised to 1800 s before the stall is detected)
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0+300x5 1500x70'
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '300x6 1800x70' # raised at minute 35, before the 300 s threshold (minute 40) is crossed
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x75'
    alert_rule_test:
      - eval_time: 60m
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 100m
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 140m
        alertname: ProbeNotWriting
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The integration probe is enabled but has not written a result for more than three intervals"
              description: "No probe round wrote deployment statuses over at least three probe intervals although the portal is up: rounds are failing (result=\"error\"), skipped by every replica or not running. Statuses are frozen, so UnprotectedDeployment reflects an old state. Check the portal logs and portal_probe_rounds_total by result."

  - name: ProbeNotWriting follows the gauge when the probe goes from disabled to enabled
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0x60' # started at 0 and never wrote
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '0x12 300x50'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x65'
    alert_rule_test:
      - eval_time: 55m # still disabled
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 65m # enabled 5 minutes ago: inside `for: 10m`
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 80m
        alertname: ProbeNotWriting
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The integration probe is enabled but has not written a result for more than three intervals"
              description: "No probe round wrote deployment statuses over at least three probe intervals although the portal is up: rounds are failing (result=\"error\"), skipped by every replica or not running. Statuses are frozen, so UnprotectedDeployment reflects an old state. Check the portal logs and portal_probe_rounds_total by result."

  - name: ProbeNotWriting is silent when the portal is down (PortalDown covers that)
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0x25'
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '300x25'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 100m
        alertname: ProbeNotWriting
        exp_alerts: []

  - name: ProbeNotWriting stays silent when the portal does not expose the interval gauge
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0x25'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 100m
        alertname: ProbeNotWriting
        exp_alerts: []

  - name: ProbeNotWriting stays silent when the portal does not expose the timestamp gauge
    interval: 5m
    input_series:
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '300x25'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 100m
        alertname: ProbeNotWriting
        exp_alerts: []

  # A restart resets the timestamp to the process start time (documented: detection is delayed by up to 3 intervals).
  # Here the probe stalls after minute 55 and would fire at minute ~81; the restart at minute 90 sets the timestamp to
  # now (5400 s), which clears the alert and restarts the clock: it fires again only 3 intervals + for later.
  - name: ProbeNotWriting restart resets the timestamp and delays detection
    interval: 5m
    input_series:
      - series: 'portal_probe_last_write_timestamp_seconds{pod="portal-a", job="portal"}'
        values: '0+300x11 3300x5 5400x50' # writes until 55 min, stalls, restarts at 90 min
      - series: 'portal_probe_interval_seconds{pod="portal-a", job="portal"}'
        values: '300x70'
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 85m # stalled and past for: fires
        alertname: ProbeNotWriting
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The integration probe is enabled but has not written a result for more than three intervals"
              description: "No probe round wrote deployment statuses over at least three probe intervals although the portal is up: rounds are failing (result=\"error\"), skipped by every replica or not running. Statuses are frozen, so UnprotectedDeployment reflects an old state. Check the portal logs and portal_probe_rounds_total by result."
      - eval_time: 100m # restarted: age is counted from the start time
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 110m # age above 3 intervals since minute 106: inside `for: 10m`
        alertname: ProbeNotWriting
        exp_alerts: []
      - eval_time: 125m
        alertname: ProbeNotWriting
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The integration probe is enabled but has not written a result for more than three intervals"
              description: "No probe round wrote deployment statuses over at least three probe intervals although the portal is up: rounds are failing (result=\"error\"), skipped by every replica or not running. Statuses are frozen, so UnprotectedDeployment reflects an old state. Check the portal logs and portal_probe_rounds_total by result."

  # ---- ProbeStatusCountErrors --------------------------------------------------------------------------------------
  - name: ProbeStatusCountErrors fires while the count keeps failing
    interval: 1m
    input_series:
      - series: 'portal_probe_status_count_errors_total{pod="portal-a", job="portal"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 5m # inside `for: 10m`
        alertname: ProbeStatusCountErrors
        exp_alerts: []
      - eval_time: 20m
        alertname: ProbeStatusCountErrors
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The portal cannot count deployments by probe status"
              description: "portal_deployments_by_probe_status is missing while the database count fails, so UnprotectedDeployment cannot fire. Check the portal database connection and the portal logs."

  - name: ProbeStatusCountErrors stays quiet without errors, and after a single one
    interval: 1m
    input_series:
      - series: 'portal_probe_status_count_errors_total{pod="portal-a", job="portal"}'
        values: '0x30'
      - series: 'portal_probe_status_count_errors_total{pod="portal-b", job="portal"}'
        values: '0x5 1x30'
    alert_rule_test:
      - eval_time: 40m
        alertname: ProbeStatusCountErrors
        exp_alerts: []

  # ---- ForwardAuthDown ---------------------------------------------------------------------------------------------
  - name: ForwardAuthDown fires when every platform-api target is down
    interval: 1m
    input_series:
      - series: 'up{job="platform-api", pod="platform-api-a"}'
        values: '1x2 0x20'
      - series: 'up{job="platform-api", pod="platform-api-b"}'
        values: '1x2 0x20'
    alert_rule_test:
      - eval_time: 4m # down since minute 2, inside `for: 3m`
        alertname: ForwardAuthDown
        exp_alerts: []
      - eval_time: 10m
        alertname: ForwardAuthDown
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "platform-api is not being scraped or is down"
              description: "No platform-api target is up. ForwardAuth decisions, logins and JWKS depend on it: every protected app fails. If the pods are running, check the scrape configuration and the NetworkPolicy to the metrics port."

  - name: ForwardAuthDown fires when there is no platform-api target at all (absent)
    interval: 1m
    input_series:
      - series: 'up{job="portal", pod="portal-a"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ForwardAuthDown
        exp_alerts:
          - exp_labels: {severity: critical, job: platform-api}
            exp_annotations:
              summary: "platform-api is not being scraped or is down"
              description: "No platform-api target is up. ForwardAuth decisions, logins and JWKS depend on it: every protected app fails. If the pods are running, check the scrape configuration and the NetworkPolicy to the metrics port."

  - name: ForwardAuthDown stays quiet while one replica is up, and for a brief outage
    interval: 1m
    input_series:
      - series: 'up{job="platform-api", pod="platform-api-a"}'
        values: '0x20'
      - series: 'up{job="platform-api", pod="platform-api-b"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ForwardAuthDown
        exp_alerts: []

  - name: ForwardAuthDown ignores a rollout shorter than for
    interval: 1m
    input_series:
      - series: 'up{job="platform-api", pod="platform-api-a"}'
        values: '1x5 0x2 1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ForwardAuthDown
        exp_alerts: []

  # ---- PortalDown --------------------------------------------------------------------------------------------------
  - name: PortalDown fires when no portal target is up, and stays quiet with one up
    interval: 1m
    input_series:
      - series: 'up{job="portal", pod="portal-a"}'
        values: '0x20'
      - series: 'up{job="portal", pod="portal-b"}'
        values: '0x20'
      - series: 'up{job="platform-api", pod="platform-api-a"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: PortalDown
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The portal is not being scraped or is down"
              description: "No portal target is up. Administration, the user's home and the integration probe are unavailable (apps keep working: ForwardAuth does not depend on the portal)."

  - name: PortalDown stays quiet while one replica is up
    interval: 1m
    input_series:
      - series: 'up{job="portal", pod="portal-a"}'
        values: '0x20'
      - series: 'up{job="portal", pod="portal-b"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: PortalDown
        exp_alerts: []

  # ---- ForwardAuthErrorsHigh ---------------------------------------------------------------------------------------
  # Counters grow per minute: +600 allow/min is 10 req/s.
  - name: ForwardAuthErrorsHigh fires above 5% errors with real traffic
    interval: 1m
    input_series:
      - series: 'platform_forwardauth_decisions_total{decision="allow", reason="granted", pod="platform-api-a", job="platform-api"}'
        values: '0+600x30'
      - series: 'platform_forwardauth_decisions_total{decision="error", reason="backend_failure", pod="platform-api-a", job="platform-api"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ForwardAuthErrorsHigh
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "More than 5% of ForwardAuth decisions are errors"
              description: "9.091% of ForwardAuth decisions over the last 5 minutes ended in an error (a backend failure such as the database, or a panic). Check the platform-api logs and the database."

  - name: ForwardAuthErrorsHigh stays quiet below 5% errors
    interval: 1m
    input_series:
      - series: 'platform_forwardauth_decisions_total{decision="allow", reason="granted", pod="platform-api-a", job="platform-api"}'
        values: '0+600x30'
      - series: 'platform_forwardauth_decisions_total{decision="error", reason="backend_failure", pod="platform-api-a", job="platform-api"}'
        values: '0+6x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ForwardAuthErrorsHigh
        exp_alerts: []

  - name: ForwardAuthErrorsHigh stays quiet on a high ratio over almost no traffic
    interval: 1m
    input_series:
      - series: 'platform_forwardauth_decisions_total{decision="allow", reason="granted", pod="platform-api-a", job="platform-api"}'
        values: '0+1x30'
      - series: 'platform_forwardauth_decisions_total{decision="error", reason="backend_failure", pod="platform-api-a", job="platform-api"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ForwardAuthErrorsHigh
        exp_alerts: []

  - name: ForwardAuthErrorsHigh stays quiet when there are no error series at all
    interval: 1m
    input_series:
      - series: 'platform_forwardauth_decisions_total{decision="allow", reason="granted", pod="platform-api-a", job="platform-api"}'
        values: '0+600x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ForwardAuthErrorsHigh
        exp_alerts: []

  - name: ForwardAuthErrorsHigh ignores an error burst shorter than for
    interval: 1m
    input_series:
      - series: 'platform_forwardauth_decisions_total{decision="allow", reason="granted", pod="platform-api-a", job="platform-api"}'
        values: '0+600x30'
      - series: 'platform_forwardauth_decisions_total{decision="error", reason="backend_failure", pod="platform-api-a", job="platform-api"}'
        values: '0x10 0+120x3 360x20'
    alert_rule_test:
      - eval_time: 29m
        alertname: ForwardAuthErrorsHigh
        exp_alerts: []

  # ---- SigningKeyNotLoaded -----------------------------------------------------------------------------------------
  - name: SigningKeyNotLoaded fires for the replica that cannot sign, not for the others
    interval: 1m
    input_series:
      - series: 'platform_signing_key_loaded{pod="platform-api-a", job="platform-api"}'
        values: '0x20'
      - series: 'platform_signing_key_loaded{pod="platform-api-b", job="platform-api"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m # inside `for: 5m`
        alertname: SigningKeyNotLoaded
        exp_alerts: []
      - eval_time: 10m
        alertname: SigningKeyNotLoaded
        exp_alerts:
          - exp_labels: {severity: critical, pod: platform-api-a, job: platform-api}
            exp_annotations:
              summary: "platform-api-a has no signing key loaded"
              description: "This platform-api replica cannot sign assertions. The usual causes are a KEK that does not open the stored keys (see SigningKeyKEKMismatch) or no active key in the database."

  - name: SigningKeyNotLoaded ignores a start-up shorter than for
    interval: 1m
    input_series:
      - series: 'platform_signing_key_loaded{pod="platform-api-a", job="platform-api"}'
        values: '0x2 1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: SigningKeyNotLoaded
        exp_alerts: []

  # ---- SigningKeyKEKMismatch ---------------------------------------------------------------------------------------
  - name: SigningKeyKEKMismatch fires on a mismatched replica only
    interval: 1m
    input_series:
      - series: 'platform_signing_key_kek_mismatch{pod="platform-api-a", job="platform-api"}'
        values: '1x20'
      - series: 'platform_signing_key_kek_mismatch{pod="platform-api-b", job="platform-api"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: SigningKeyKEKMismatch
        exp_alerts: []
      - eval_time: 10m
        alertname: SigningKeyKEKMismatch
        exp_alerts:
          - exp_labels: {severity: critical, pod: platform-api-a, job: platform-api}
            exp_annotations:
              summary: "platform-api-a has a KEK that does not match the signing keys"
              description: "The KEK mounted on this replica does not open the active or next signing key. Restore the KEK the keys were sealed with."

  - name: SigningKeyKEKMismatch stays quiet when the KEK matches, and for a blip
    interval: 1m
    input_series:
      - series: 'platform_signing_key_kek_mismatch{pod="platform-api-a", job="platform-api"}'
        values: '0x20'
      - series: 'platform_signing_key_kek_mismatch{pod="platform-api-b", job="platform-api"}'
        values: '0x5 1 0x14'
    alert_rule_test:
      - eval_time: 15m
        alertname: SigningKeyKEKMismatch
        exp_alerts: []

  # ---- DBPoolSaturated ---------------------------------------------------------------------------------------------
  - name: DBPoolSaturated fires for a saturated platform-api pool
    interval: 1m
    input_series:
      - series: 'platform_db_pool_acquired_connections{pod="platform-api-a", job="platform-api"}'
        values: '31x30'
      - series: 'platform_db_pool_max_connections{pod="platform-api-a", job="platform-api"}'
        values: '32x30'
      - series: 'portal_db_pool_acquired_connections{pod="portal-a", job="portal"}'
        values: '2x30'
      - series: 'portal_db_pool_max_connections{pod="portal-a", job="portal"}'
        values: '32x30'
    alert_rule_test:
      - eval_time: 5m # inside `for: 10m`
        alertname: DBPoolSaturated
        exp_alerts: []
      - eval_time: 20m
        alertname: DBPoolSaturated
        exp_alerts:
          - exp_labels: {severity: warning, pod: platform-api-a, job: platform-api}
            exp_annotations:
              summary: "platform-api platform-api-a uses more than 90% of its database pool"
              description: "96.88% of the connections of the pool are in use. Look for slow queries or raise the pool size (and PostgreSQL max_connections with it)."

  - name: DBPoolSaturated fires for a saturated portal pool
    interval: 1m
    input_series:
      - series: 'platform_db_pool_acquired_connections{pod="platform-api-a", job="platform-api"}'
        values: '2x30'
      - series: 'platform_db_pool_max_connections{pod="platform-api-a", job="platform-api"}'
        values: '32x30'
      - series: 'portal_db_pool_acquired_connections{pod="portal-a", job="portal"}'
        values: '32x30'
      - series: 'portal_db_pool_max_connections{pod="portal-a", job="portal"}'
        values: '32x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DBPoolSaturated
        exp_alerts:
          - exp_labels: {severity: warning, pod: portal-a, job: portal}
            exp_annotations:
              summary: "portal portal-a uses more than 90% of its database pool"
              description: "100% of the connections of the pool are in use. Look for slow queries or raise the pool size (and PostgreSQL max_connections with it)."

  - name: DBPoolSaturated stays quiet at normal use and for a short spike
    interval: 1m
    input_series:
      - series: 'platform_db_pool_acquired_connections{pod="platform-api-a", job="platform-api"}'
        values: '10x30'
      - series: 'platform_db_pool_max_connections{pod="platform-api-a", job="platform-api"}'
        values: '32x30'
      - series: 'portal_db_pool_acquired_connections{pod="portal-a", job="portal"}'
        values: '2x5 32x4 2x25'
      - series: 'portal_db_pool_max_connections{pod="portal-a", job="portal"}'
        values: '32x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: DBPoolSaturated
        exp_alerts: []

  # ---- LoginsFailing / LoginProviderUnavailable --------------------------------------------------------------------
  - name: LoginsFailing fires on a burst of failed logins with no success
    interval: 1m
    input_series:
      - series: 'platform_logins_total{outcome="failed", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1+1x40'
      - series: 'platform_logins_total{outcome="success", pod="platform-api-a", job="platform-api"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 12m # the threshold is crossed at about minute 9, `for: 5m` still running
        alertname: LoginsFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: LoginsFailing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Google logins are failing and none succeeded in 15 minutes"
              description: "15 logins ended in outcome=\"failed\" over 15 minutes with no success. Existing sessions keep working; new logins do not. After a Google client secret rotation, or if it was disabled or deleted, look for `invalid_client` in the platform-api logs: `kubectl -n platform logs -l app.kubernetes.io/name=platform-api --since=30m --tail=-1 | rg 'google login failed'`. Runbook: platform-gitops/docs/runbooks/google-client-secret-rotation.md (Detecting failures, Rollback)."

  - name: LoginsFailing stays quiet when logins also succeed
    interval: 1m
    input_series:
      - series: 'platform_logins_total{outcome="failed", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1+1x40'
      - series: 'platform_logins_total{outcome="success", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LoginsFailing
        exp_alerts: []

  - name: LoginsFailing stays quiet on a single failed login
    interval: 1m
    input_series:
      - series: 'platform_logins_total{outcome="failed", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1x40'
      - series: 'platform_logins_total{outcome="success", pod="platform-api-a", job="platform-api"}'
        values: '3x45'
    alert_rule_test:
      - eval_time: 30m
        alertname: LoginsFailing
        exp_alerts: []

  - name: LoginsFailing stays quiet on a failed login and a retry (no success series at all)
    interval: 1m
    input_series:
      - series: 'platform_logins_total{outcome="failed", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1 2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LoginsFailing
        exp_alerts: []

  - name: LoginsFailing respects for (a burst that ends before 5 minutes of condition)
    interval: 1m
    input_series:
      - series: 'platform_logins_total{outcome="failed", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1+1x6 7x60'
      - series: 'platform_logins_total{outcome="success", pod="platform-api-a", job="platform-api"}'
        values: '0x4 0x2 1+1x58'
    alert_rule_test:
      - eval_time: 12m # 6 failures, the first success arrives at minute 6: the condition never holds 5 minutes
        alertname: LoginsFailing
        exp_alerts: []

  - name: LoginsFailing counts a missing success series as zero and fires
    interval: 1m
    input_series:
      - series: 'platform_logins_total{outcome="failed", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1+1x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: LoginsFailing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Google logins are failing and none succeeded in 15 minutes"
              description: "15 logins ended in outcome=\"failed\" over 15 minutes with no success. Existing sessions keep working; new logins do not. After a Google client secret rotation, or if it was disabled or deleted, look for `invalid_client` in the platform-api logs: `kubectl -n platform logs -l app.kubernetes.io/name=platform-api --since=30m --tail=-1 | rg 'google login failed'`. Runbook: platform-gitops/docs/runbooks/google-client-secret-rotation.md (Detecting failures, Rollback)."

  - name: LoginsFailing is silent when the metric is absent
    interval: 1m
    input_series:
      - series: 'up{job="platform-api", pod="platform-api-a"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: LoginsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: LoginProviderUnavailable
        exp_alerts: []

  - name: LoginProviderUnavailable fires on a Google outage with no successful login
    interval: 1m
    input_series:
      - series: 'platform_logins_total{outcome="provider_unavailable", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1+1x40'
      - series: 'platform_logins_total{outcome="success", pod="platform-api-a", job="platform-api"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 12m # inside `for: 10m`
        alertname: LoginProviderUnavailable
        exp_alerts: []
      - eval_time: 30m
        alertname: LoginProviderUnavailable
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Logins cannot reach Google and none succeeded in 15 minutes"
              description: "15 logins ended in outcome=\"provider_unavailable\" over 15 minutes with no success. Check the Google status, the egress from the platform namespace to Google and the platform-api logs (`rg 'google login: provider unavailable'`). If Google is fine, see platform-gitops/docs/runbooks/google-client-secret-rotation.md (Detecting failures)."

  - name: LoginProviderUnavailable stays quiet when another replica still logs users in
    interval: 1m
    input_series:
      - series: 'platform_logins_total{outcome="provider_unavailable", pod="platform-api-a", job="platform-api"}'
        values: '0x4 1+1x40'
      - series: 'platform_logins_total{outcome="success", pod="platform-api-b", job="platform-api"}'
        values: '0x4 1+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LoginProviderUnavailable
        exp_alerts: []
